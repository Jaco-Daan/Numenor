l_english:
 ### Numenor Submod Religions ###

 faith_adunaic: "Adûnabên"
 faith_adunaic_adj: "Adûnabên" # An-Adûnabên
 faith_adunaic_adherent: "Adûnabên"
 faith_adunaic_adherent_plural: "Adûnabênî"
 faith_adunaic_desc: "The [Glossary('Adûnabên','adunaben_gloss')] is the common faith of the [adunai|E] of [anadune|E], founded by Tar-Vëantur the Pragmatic to carry his people forth in an [Concept('eruiluvatar','Êru')|E]-fearing manner which all could support. The Adûnabênî preserve many of the teachings of the [faithful|E], including revering the [avaloigods|E]. The milennia of isolation which preceded this reform lead to a stern, deeply conservative tradition. They still hold that the Adûnâi were entrusted with their long lives and wisdom not for dominion, but stewardship, with the [akallabeth|E] serving as an eternal warning against pride and self-aggrandizement.\n\nThough many of the ancient rites of the Eruainocimië have faded and been set aside with time, the reverence for the [meneltarma|E] remains, as the fane of Êru. Once every half-decade, another tradition was started, a memorial for the victims of the Shadow. There, elders warn the young, so that the evils of their past would not be repeated."

 faith_dairaben: "Batân an-Phazân"
 faith_dairaben_adj: "Batân an-Phazân" # 'nBatâna 'nPhazân
 faith_dairaben_adherent: "Phazâmbên"
 faith_dairaben_adherent_plural: "Phazâmbênî"
 faith_dairaben_desc: "[Glossary('Batân an-Phazân','batan_an_phazan_gloss')] is a faith that emerged following the [akallabeth|E] from the shattered remnants of the Ârûwânai - only the moderate factions had survived the destruction caused by [Concept('eruiluvatar','Êru')|E]. The majority of Ârûwânai refused to aid the few remaining Mulkhêrhilî and sided with Prince Dâirabên's decision to support the compromise of Ar-Zimraphel following the Council of Ondosto. His people aided her during the First Númenórean Civil War and with the reconstruction process that began afterwards.\n\nThe $faith_dairaben_adj$ teachings are mostly a continuation of the [kingsmen|E], though they adhere somewhat to the Valar and the majority of their teachings. $faith_dairaben_adherent_plural$ display the same Adûnâi arrogance that had plagued Anadûnê before the Akallabêth, putting an emphasis on the 'traditional values' of the Adûnâi. Indeed, this faction eventually went against the policies of pragmatism preached at the Council of Ondosto, and have continued the remembrance and veneration of the ancestors began by Tar-Atanamir."
