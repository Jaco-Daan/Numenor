l_english:

 ### Numenor Submod Tradition ###
 tradition_adunaim_pride_name: "Bârîm-an-Anadûnê"
 tradition_adunaim_pride_desc: "Few among the inhabitants of the world can be said to carry themselves as the [Glossary('Bârîm-an-Anadûnê','barim_an_anadune_gloss')] do. Their pride in their land and people is unparalleled, with long centuries of prosperity and isolation fostering a profound reverence for the legacy of [anadune|E], of their forefathers. They are however mindful of the ruin once brought by pride upon their people, and so carefully preserve both the good and evil of their history, in hopes to never see the ruin of Westernesse repeated."

 tradition_elennahin_pride_name: "Glor en Elennahín"
 tradition_elennahin_pride_desc: "Of all the peoples of the world, few carry themselves with the solemn dignity of the [Glossary('Glor en Elennahín','glor_en_elennahin_gloss')], for they dwell within the greatest realm ever raised by Men, [numenor|E]. Years of living in the ancient island of [numenor|E] have fostered in them a profound reverence for the legacy of [elenna_nore|E] and the traditions handed down from their forefathers. Mindful of the pride that once brought ruin upon Westernesse, they guard their customs carefully and place great value upon kinship, memory, and the preservation of their ancient heritage."
 glor_en_elennahin_gloss: "[sindarin_short|E] #bold Glor en Elennahín#! means 'Pride of the Children of Elenna'."
